name: OCaml reference conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    # Include the pinned Goose source build and both migration receipt runs.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit estate layout
        run: sh tools/estate-audit.sh
      - name: Build pinned OCaml bytecode compiler
        run: |
          set -eu
          compiler="$RUNNER_TEMP/ocaml"
          mkdir "$compiler"
          curl --fail --silent --show-error --location --proto '=https' \
            -o "$compiler/source.tgz" https://registry.npmjs.org/ocaml/-/ocaml-5.5.1000.tgz
          expected='mVJPlS4R2in1AAw+hUBFQqgUq52KHgxu7a6D3306hDyG/SU6e7/YlIbuAUXJ7PXwBBGQe+SMuDyTeVjydwoIbQ=='
          test "$(openssl dgst -sha512 -binary "$compiler/source.tgz" | openssl base64 -A)" = "$expected"
          tar xzf "$compiler/source.tgz" --strip-components=1 -C "$compiler"
          cd "$compiler"
          ./configure --disable-native-compiler --prefix="$RUNNER_TEMP/ocaml-install"
          make -j2 world
          make install
          echo "$RUNNER_TEMP/ocaml-install/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' \
            -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Replay OCaml and regenerate Lean vectors
        run: |
          test "$(ocamlc -version)" = "$(cat .ocaml-version)"
          sh conformance/run.sh --lean
      - name: Build pinned Goose
        run: |
          set -eu
          # ubuntu-24.04 supplies CMake >= 3.27; Goose enforces that minimum.
          cmake --version
          sh tools/build_goose.sh "$RUNNER_TEMP/goose"
      - name: Replay bounded Goose migration controls
        env:
          GOOSE_SOURCE: ${{ runner.temp }}/goose
        run: make test-goose GOOSE_TEST_ARGS="--definitions 16"
      - name: Smoke test Goose comparison runner
        env:
          GOOSE_SOURCE: ${{ runner.temp }}/goose
        # This verifies the runner and receipt format; CI timings are not a speed gate.
        run: >-
          make benchmark-goose
          GOOSE_BENCHMARK_ARGS="--samples 1 --definitions 8 --workers 1
          --min-sample-seconds 0.05 --output conformance/evidence/goose-ci-smoke"
      - name: Preserve Goose migration receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goose-migration-receipts
          path: |
            conformance/evidence/goose-conformance/
            conformance/evidence/goose-ci-smoke/
          if-no-files-found: ignore
          retention-days: 30
